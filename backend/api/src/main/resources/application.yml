server:
  port: 8080

spring:
  application:
    name: kb-qa-api
  datasource:
    url: jdbc:mysql://localhost:3306/kb_qa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        default-requeue-rejected: false
  elasticsearch:
    uris: http://localhost:9200
  data:
    elasticsearch:
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: true
    rabbit:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    cn.exitcode.richpeasants: DEBUG
    org.springframework.security: INFO

app:
  jwt:
    secret: kb-qa-dev-secret-key-change-in-prod-32b
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 604800
  minio:
    endpoint: https://
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: companyomnibase
    base-path: kb-qa
  elasticsearch:
    chunk-index: kb_chunk_vector
    memory-index: user_memory_vector
  embedding:
    batch-size: 8
    connect-timeout-ms: 15000
    read-timeout-ms: 120000
  rag:
    top-k: 5
    max-context-chars: 6000
    citation-preview-chars: 240
    connect-timeout-ms: 15000
    read-timeout-ms: 120000
    temperature: 0.2
    memory:
      short-term:
        max-turns: 8
        max-chars: 12000
      long-term:
        enabled: true
        top-k: 5
        min-score: 0.52
        duplicate-threshold: 0.90
        max-inject-chars: 1500
        max-per-user: 100
        extract-enabled: true
    agent:
      max-tool-rounds: 3
      tavily:
        api-key: ${TAVILY_API_KEY:}
        base-url: https://api.tavily.com
        max-results: 5
      weather:
        geocode-url: https://geocoding-api.open-meteo.com/v1/search
        forecast-url: https://api.open-meteo.com/v1/forecast
