server:
  port: 8080

spring:
  application:
    name: kb-qa-api
  datasource:
    url: jdbc:mysql://localhost:3306/kb_qa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  elasticsearch:
    uris: http://localhost:9200
  data:
    elasticsearch:
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: true
    rabbit:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    cn.exitcode.richpeasants: DEBUG
    org.springframework.security: INFO

app:
  jwt:
    secret: kb-qa-dev-secret-key-change-in-prod-32b
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 604800
  minio:
    endpoint: https://
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: companyomnibase
    base-path: kb-qa
